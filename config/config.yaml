# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

sources:
  skills: /Users/goberlec/personal/skills/library
  agents: /Users/goberlec/personal/skills/agents/claude

mode: merge

targets:
  claude:
    skills:
      path: /Users/goberlec/.claude/skills
  claude-personal:
    agent: claude
    config_dir: /Users/goberlec/.claude-personal
  codex:
    skills:
      path: /Users/goberlec/.codex/skills
      enabled: false
  omp:
    skills:
      path: /Users/goberlec/.omp/agent/skills
  shared:
    skills:
      path: /Users/goberlec/.agents/skills
      mode: symlink

extras:
  - name: review-agents-omp
    source: /Users/goberlec/personal/skills/agents/omp
    targets:
      - path: /Users/goberlec/.omp/agent/agents
        mode: merge
  - name: review-agents-codex
    source: /Users/goberlec/personal/skills/agents/codex
    targets:
      - path: /Users/goberlec/.codex/agents
        mode: copy

